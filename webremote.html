<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e3440" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eceff4" media="(prefers-color-scheme: light)">
  <title>Rhythmbox Remote</title>
  <link rel="stylesheet" href="/css/webremote.css" />
  <script type="text/javascript" src="/js/webremote.js"></script>
</head>
<body>
  <!-- Material icons, drawn with currentColor so they follow the theme -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.79-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm7 0h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
    <symbol id="i-vol-full" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
    <symbol id="i-vol-medium" viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></symbol>
    <symbol id="i-vol-low" viewBox="0 0 24 24"><path d="M7 9v6h4l5 5V4l-5 5H7z"/></symbol>
    <symbol id="i-vol-muted" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 0 0 10 13c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0v2z"/></symbol>
  </svg>

  <!-- Connection screen -->
  <main id="connectform" class="connect-screen">
    <form id="connect-form" class="connect-card">
      <div class="connect-logo"><svg><use href="#i-note"/></svg></div>
      <h1 class="connect-title">Rhythmbox Remote</h1>
      <p class="connect-subtitle">Enter the passphrase set in the plugin preferences.</p>
      <label class="text-field">
        <svg class="text-field-icon"><use href="#i-lock"/></svg>
        <input type="password" id="accesskey" placeholder="Passphrase" autocomplete="off" aria-label="Passphrase" />
      </label>
      <p class="connect-error" id="connect-error" hidden>Couldn't connect. Check the passphrase and try again.</p>
      <button type="submit" class="btn-filled" id="connectbutton">
        Connect
        <svg><use href="#i-arrow"/></svg>
      </button>
    </form>
  </main>

  <!-- Player -->
  <div id="player-interface" class="app" hidden>

    <header class="top-bar">
      <div class="top-bar-inner">
        <label class="search-bar">
          <svg class="search-icon"><use href="#i-search"/></svg>
          <input type="search" id="search-input" placeholder="Search songs, artists, albums" autocomplete="off" enterkeyhint="search" aria-label="Search library" />
          <button type="button" class="icon-btn search-clear" id="search-clear" aria-label="Clear search" hidden>
            <svg><use href="#i-close"/></svg>
          </button>
        </label>
      </div>
    </header>

    <main class="library" id="library">
      <div class="library-inner">
        <div class="list-header">
          <span id="result-count">Loading library…</span>
          <span class="list-header-host" id="connectionhostname"></span>
        </div>
        <div class="list-columns" id="list-columns" role="toolbar" aria-label="Sort songs">
          <span></span>
          <button type="button" class="col-sort" data-sort="title">Title<svg><use href="#i-sort"/></svg></button>
          <button type="button" class="col-sort" data-sort="artist">Artist<svg><use href="#i-sort"/></svg></button>
          <button type="button" class="col-sort" data-sort="album">Album<svg><use href="#i-sort"/></svg></button>
          <button type="button" class="col-sort" data-sort="year">Year<svg><use href="#i-sort"/></svg></button>
          <button type="button" class="col-sort col-length" data-sort="duration"><svg><use href="#i-sort"/></svg>Length</button>
        </div>
        <ul class="song-list" id="song-list" role="list"></ul>
        <div class="list-status" id="list-status"></div>
        <div id="list-sentinel" aria-hidden="true"></div>
      </div>
    </main>

    <footer class="player-bar">
      <div class="player-bar-inner">

        <div class="now-playing">
          <div class="now-art" id="trackimage">
            <svg class="art-placeholder"><use href="#i-note"/></svg>
          </div>
          <div class="now-text">
            <div class="now-title" id="tracktitle">Not Playing</div>
            <div class="now-subtitle">
              <span id="trackartist"></span><span class="dot" id="trackdot" hidden> · </span><span id="trackalbum"></span>
            </div>
          </div>
          <button class="icon-btn volume-btn volume-mobile" data-volume aria-label="Volume: 100%" title="Volume: 100% (click to change)">
            <svg><use href="#i-vol-full"/></svg>
            <span class="volume-label">100%</span>
          </button>
        </div>

        <div class="transport">
          <div class="controls">
            <button class="icon-btn mode-btn" id="shuffle" aria-pressed="false" aria-label="Shuffle: off" title="Shuffle: off">
              <svg><use href="#i-shuffle"/></svg>
            </button>
            <button class="icon-btn control-btn" id="previous" aria-label="Previous">
              <svg><use href="#i-prev"/></svg>
            </button>
            <button class="play-btn" id="playpause" aria-label="Play">
              <svg><use href="#i-play"/></svg>
            </button>
            <button class="icon-btn control-btn" id="next" aria-label="Next">
              <svg><use href="#i-next"/></svg>
            </button>
            <button class="icon-btn mode-btn" id="repeat" data-mode="off" aria-label="Repeat: off" title="Repeat: off">
              <svg><use href="#i-repeat"/></svg>
            </button>
          </div>
          <div class="progress">
            <span class="time" id="trackposition">0:00</span>
            <input type="range" id="seekbar-range" class="seekbar" min="0" max="100" value="0" aria-label="Seek">
            <span class="time" id="trackduration">0:00</span>
          </div>
        </div>

        <div class="player-extra">
          <button class="icon-btn volume-btn" data-volume aria-label="Volume: 100%" title="Volume: 100% (click to change)">
            <svg><use href="#i-vol-full"/></svg>
            <span class="volume-label">100%</span>
          </button>
        </div>

      </div>
    </footer>
  </div>

  <div id="stream-container"></div>
</body>
</html>
